name: Verify and deploy Spooky
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify source, imports and provenance
        run: |
          node scripts/check.mjs
          node --test tests/*.test.js
          node scripts/build.mjs
          git diff --exit-code -- sw.js
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/spooky-browser" --no-save --package-lock=false playwright@1.56.0
          "$RUNNER_TEMP/spooky-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Play all stations and verify controls, touch and offline mode
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/spooky-browser/node_modules/playwright
        run: node tests/browser.mjs
      - name: Preserve browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spooky-browser-evidence
          path: test-results/
          if-no-files-found: error
      - name: Stage the verified public build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified game
        id: deployment
        uses: actions/deploy-pages@v4
